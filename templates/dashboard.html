<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLANTIDE — Pattern Scalp | Professional</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Initializing...</div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">
    <span class="topbar-logo">⚡ ATLANTIDE</span>
    <span class="topbar-status" id="livePill">● LIVE</span>
    <span style="font-size:10px;color:var(--text-muted);" id="symCount"></span>
  </div>
  <div class="topbar-stats" id="topbarStats"></div>
  <div>
    <span class="topbar-clock" id="clock">00:00:00</span>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-accent btn-sm" onclick="addSymbol()">+ Symbol</button>
    <button class="btn btn-danger btn-sm" onclick="resetAll()">Reset All</button>
  </div>
</div>

<!-- SESSIONS BAR -->
<div class="sessions-bar" id="sessionsBar"></div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- Selector Bar -->
  <div class="selector-bar">
    <span class="selector-label">Active Symbols:</span>
    <div class="active-chips" id="activeChips"></div>
    <select id="symbolSelect"><option value="">+ Add Symbol</option></select>
  </div>

  <!-- Symbol Panels -->
  <div class="symbol-grid" id="symbolGrid"></div>

  <!-- Trade History -->
  <div class="panel">
    <div class="panel-header">
      <span>📜 Trade History</span>
      <span style="font-weight:400;" id="closedCount">(0)</span>
    </div>
    <div class="panel-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Sym</th><th>ID</th><th>Side</th><th>Entry</th><th>Exit</th><th>Notional</th><th>PnL</th><th>Result</th><th>Time</th></tr></thead>
          <tbody id="closedTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Event Log -->
  <div class="panel">
    <div class="panel-header">📝 Event Log</div>
    <div class="panel-body">
      <div class="event-log" id="eventLogContainer">
        <div id="eventLog"></div>
      </div>
    </div>
  </div>

</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
